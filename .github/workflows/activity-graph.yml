name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph
    steps:
      - uses: actions/checkout@v3
      - uses: maurodesouza/github-readme-activity-graph-action@v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: dist/github-readme-activity-graph.svg
          theme: react-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
